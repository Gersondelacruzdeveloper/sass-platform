<div style="font-family: Arial, sans-serif; line-height: 1.5; color: #111827;">
  <h2>Booking ticket issued</h2>
  <p><strong>Booking:</strong> {{ booking.booking_code }}</p>
  <p><strong>Customer:</strong> {{ booking.customer_name }}</p>
  <p><strong>Service date:</strong> {{ booking.service_date }}</p>
  <p><strong>Service time:</strong> {{ booking.service_time }}</p>
  <p><strong>Guests:</strong> {{ booking.total_guests }}</p>
  <p><strong>Hotel/Pickup:</strong> {{ booking.customer_hotel }}</p>
  <p>The booking PDF is attached.</p>
</div>
